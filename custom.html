<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自定义联赛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* 自定义联赛：和威超主站同一套配色变量（读同一个 ves_theme），独立存档 */
:root{--bg:#0c0c0a;--bg-2:#141412;--fg:#ece8df;--fg-2:#a7a195;--fg-3:#6e695f;--tint:236,232,223;--accent:#ff5b1f;--acc-rgb:255,91,31;--acc-ink:#1a0a03;--gold:#d6ad57;--win:#5cc48c;--draw:#8c877c;--loss:#e8574a;
  --line:rgba(var(--tint),.085);--line-2:rgba(var(--tint),.17);--panel:rgba(var(--tint),.028);--panel-2:rgba(var(--tint),.055);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--disp:"Barlow Condensed","Noto Sans SC",sans-serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1);color-scheme:dark}
:root[data-theme="pitch"]{--bg:#08110c;--bg-2:#0e1913;--fg:#e8efe4;--fg-2:#9db0a0;--fg-3:#5f7466;--tint:222,236,214;--accent:#b4e05a;--acc-rgb:180,224,90;--acc-ink:#0f1a05}
:root[data-theme="royal"]{--bg:#070a14;--bg-2:#0d1220;--fg:#e8ecf5;--fg-2:#9aa6bd;--fg-3:#5d6880;--tint:214,224,245;--accent:#e4b450;--acc-rgb:228,180,80;--acc-ink:#1d1403}
:root[data-theme="glacier"]{--bg:#080b0e;--bg-2:#0f1419;--fg:#e6eef2;--fg-2:#98a8b2;--fg-3:#5c6c76;--tint:220,235,242;--accent:#3fd4e6;--acc-rgb:63,212,230;--acc-ink:#03181b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.55 var(--sans);min-height:100vh;background-image:radial-gradient(1100px 680px at 8% -12%,rgba(var(--tint),.05),transparent 62%)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}.muted{color:var(--fg-2)}.dim{color:var(--fg-3)}
header.top{position:sticky;top:0;z-index:20;background:rgba(12,12,10,.96);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.brand b{font-weight:900;font-size:15px}.brand small{display:block;font:500 9.5px var(--mono);letter-spacing:.18em;color:var(--fg-3)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:4px;color:var(--fg-2);white-space:nowrap;font-size:13.5px}nav.tabs button:hover{color:var(--fg);background:var(--panel)}nav.tabs button.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
main{max-width:1280px;margin:0 auto;padding:24px 16px 64px;display:grid;gap:18px}
h1{margin:0;font-weight:900;font-size:clamp(24px,3.4vw,38px);line-height:1.1}h2{margin:0;font-size:16px;font-weight:700}h3{margin:0;font-size:15px}
.eyebrow{font:500 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3)}
.panel{background:linear-gradient(165deg,rgba(var(--tint),.04),rgba(var(--tint),.012) 40%,rgba(0,0,0,.12)),var(--bg);border:1px solid var(--line);border-top-color:rgba(var(--tint),.14);border-radius:4px;padding:18px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:3px;border:1px solid var(--line-2);background:transparent;color:var(--fg);font-size:13px;text-decoration:none;white-space:nowrap}.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--acc-ink);font-weight:700}.btn.primary:hover{filter:brightness(1.08)}.btn.danger:hover{border-color:var(--loss);color:var(--loss)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:3px;border:1px solid var(--line-2);font-size:11.5px;color:var(--fg-2)}.chip.on{border-color:var(--accent);color:var(--accent)}.chip.bad{border-color:var(--loss);color:var(--loss)}.chip.good{border-color:var(--win);color:var(--win)}
label.f{display:grid;gap:5px;font-size:12px;color:var(--fg-2)}
input[type=text],input[type=number],select{width:100%;padding:8px 10px;border-radius:3px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg)}input[type=color]{width:42px;height:32px;padding:0;border:1px solid var(--line-2);background:none;border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:13px}th{font:400 10px var(--mono);letter-spacing:.12em;color:var(--fg-3);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:7px 8px;border-bottom:1px solid rgba(var(--tint),.05);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}th.l,td.l{text-align:left;font-family:var(--sans)}tr.click{cursor:pointer}tr.click:hover td{background:var(--panel)}
.tw{overflow-x:auto}
.tcell{display:inline-flex;align-items:center;gap:8px}.crest{display:inline-block;vertical-align:middle;flex:none}
.arch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.arch .st{font:500 10.5px var(--mono);letter-spacing:.12em}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.tcard{display:grid;justify-items:center;gap:6px;padding:16px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);text-align:center;cursor:pointer}.tcard:hover{border-color:var(--accent)}.tcard b{font-size:14px}
dialog{border:1px solid var(--line-2);border-radius:6px;background:var(--bg-2);color:var(--fg);padding:0;max-width:min(900px,calc(100vw - 24px));width:100%}dialog::backdrop{background:rgba(0,0,0,.65)}.dlg{padding:20px;display:grid;gap:16px;max-height:calc(100vh - 60px);overflow:auto}
.err{display:grid;gap:6px;margin:0;padding-left:18px;color:var(--loss);font-size:13px}.ok{color:var(--win)}
.fx{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(var(--tint),.05)}.fx .h{justify-self:end}.fx .sc{text-align:center;font:700 16px var(--disp);letter-spacing:.04em}
.big{font:800 clamp(44px,6vw,72px)/.9 var(--disp)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--bg-2);border:1px solid var(--line-2);padding:9px 16px;border-radius:4px;font-size:13px;z-index:50}
.sel{width:16px;height:16px;accent-color:var(--accent)}
.tpl{display:flex;gap:8px;flex-wrap:wrap}.tpl button{padding:6px;border:1px solid var(--line-2);border-radius:4px;background:none}.tpl button.on{border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="./" title="回到威超主站"><img id="brandLogo" alt="" height="36"><span><b id="brandName">自定义联赛</b><small id="brandSub">CUSTOM LEAGUE</small></span></a>
  <nav class="tabs" id="tabs"></nav>
  <a class="btn" href="./">← 威超主站</a>
</div></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<script>/* ===== VES League 比赛模拟引擎 =====
   依赖全局：PLAYER_DATABASE, TEAMS_DATA, HISTORY */
const ENGINE = (() => {
  const clean = s => String(s || '').replace(/[·\s]/g, '');
  const LINE = p => {
    if (p === 'GK') return 'GK';
    if (/CB|LB|RB|WB/.test(p)) return 'DF';
    if (/DM|CM|LM|RM|AM/.test(p)) return 'MF';
    return 'FW';
  };
  // 进球/助攻倾向（按位置）
  const GOAL_W = { GK: 0, DF: 0.35, MF: 1.1, FW: 4.2 };
  const POS_GOAL = p => /CAM|LAM|RAM/.test(p) ? 1.9 : /LW|RW/.test(p) ? 2.3 : /ST/.test(p) ? 3.1 : /WB/.test(p) ? 0.7 : GOAL_W[LINE(p)];
  const POS_AST = p => /CAM|LAM|RAM/.test(p) ? 3.4 : /LW|RW|LM|RM/.test(p) ? 2.8 : /WB|LB|RB/.test(p) ? 1.6 : /CM/.test(p) ? 2 : /CDM|DM/.test(p) ? 1 : /ST/.test(p) ? 1.6 : LINE(p) === 'GK' ? 0.05 : 0.5;

  // ---------- 阵容 ----------
  const lineupCache = {};
  function lineup(team) {
    if (lineupCache[team]) return lineupCache[team];
    const T = TEAMS_DATA[team], squad = PLAYER_DATABASE[team] || [];
    const used = new Set();
    const xi = T.roster.map(r => {
      const n = clean(r.name);
      let p = squad.find(s => !used.has(s) && clean(s.name) === n)
        || squad.find(s => !used.has(s) && (clean(s.name).includes(n) || n.includes(clean(s.name))));
      if (p) used.add(p);
      const coord = T.coords[r.pos] || [50, 50];
      return {
        slot: r.pos, name: p ? p.name : r.name, rating: p ? p.rating - (r.pen || 0) : r.rating, pen: r.pen || 0,
        p: p || { name: r.name, pos: r.pos, rating: r.rating, attributes: {} },
        x: coord[0], y: coord[1], line: LINE(r.pos)
      };
    });
    const bench = squad.filter(s => !used.has(s)).sort((a, b) => b.rating - a.rating);
    return (lineupCache[team] = { xi, bench });
  }

  // ---------- 球队实力 ----------
  function strengthOf(L) {
    const { xi, bench } = L;
    const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 75;
    const by = l => xi.filter(s => s.line === l).map(s => s.rating);
    const gk = avg(by('GK')), df = avg(by('DF')), mf = avg(by('MF')), fw = avg(by('FW'));
    const xiAvg = avg(xi.map(s => s.rating));
    const depth = avg(bench.slice(0, 7).map(p => p.rating));
    const atk = fw * 0.5 + mf * 0.35 + df * 0.05 + xiAvg * 0.1;
    const def = df * 0.45 + gk * 0.25 + mf * 0.2 + xiAvg * 0.1;
    const ctl = mf * 0.6 + xiAvg * 0.4;
    return { gk, df, mf, fw, atk, def, ctl, xiAvg, depth, ovr: xiAvg * 0.8 + depth * 0.2 };
  }
  const strengthCache = {};
  function strength(team) { return strengthCache[team] || (strengthCache[team] = strengthOf(lineup(team))); }

  // ---------- 轮换 / 伤停后的实际首发 ----------
  // ctx: { out: {球员名: 缺阵原因}, streak: {球员名: 连续首发场数} }
  const baseRole = pos => roleOf(String(pos || '').replace(/-.*/, ''));
  // 传球员对象时：在他所有可踢的位置（主位置 + alt）里取最合适的；边后卫 / 边前卫站在和惯用脚相反的一边略吃亏（边锋内切不算）
  function fitCost(slot, pos) {
    if (pos && typeof pos === 'object') { const p = pos, L = [p.pos].concat(p.alt || []); let c = Math.min(...L.map(x => fitCost0(slot, x)));
      const sl = String(slot).replace(/-.*/, ''); if (c < 30 && p.foot && p.foot !== '双脚' && /^(LB|LWB|LM|RB|RWB|RM)$/.test(sl) && ((sl[0] === 'L' && p.foot === '右脚') || (sl[0] === 'R' && p.foot === '左脚'))) c += 1;
      return c; }
    return fitCost0(slot, pos);
  }
  function fitCost0(slot, pos) {
    if (!pos) return 6;
    const a = String(slot).replace(/-.*/, ''), b = String(pos);
    if (a.replace(/^[LR]/, '') === b.replace(/^[LR]/, '') || a === b) return 0;
    if ((b === 'CF' && /ST$/.test(a)) || (a === 'CF' && /ST$/.test(b))) return 0; // 中锋踢前锋位置不扣分
    if (LINE(a) === 'GK' || LINE(b) === 'GK') return 30;
    if (baseRole(a) === baseRole(b)) return 1;
    if (LINE(a) === LINE(b)) return 4;
    return 10;
  }
  // 精力：80 以上不受影响，越低能力打折越多（最多 -7），也更容易受伤、失误
  const fatPen = E => E == null || E >= 75 ? 0 : Math.min(7, (75 - E) * 0.16);
  function pickXI(team, ctx) {
    const base = lineup(team);
    if (!ctx) return { xi: base.xi.map(x => ({ ...x, start: 1 })), bench: base.bench.slice(), out: [], rested: [] };
    const out = ctx.out || {}, streak = ctx.streak || {};
    const pool = base.bench.filter(p => !out[p.name]);
    const usedB = new Set();
    const best = base.xi.reduce((m, x) => Math.max(m, x.rating), 0);
    const repl = (slot, minR) => {
      let bp = null, bv = -1e9;
      pool.forEach(p => { if (usedB.has(p)) return; const v = p.rating - fitCost(slot, p) * 1.2; if (v > bv) { bv = v; bp = p; } });
      if (!bp || (minR != null && bp.rating - fitCost(slot, bp) < minR)) return null;
      usedB.add(bp); return bp;
    };
    const missing = [], rested = [];
    const xi = base.xi.map(x => {
      let why = out[x.name];
      if (!why) {
        const st = streak[x.name] || 0, EN = ctx.energy ? ctx.energy[x.name] : null;
        let pr = EN != null ? (EN < 62 ? 0.5 : EN < 68 ? 0.18 : EN < 74 ? 0.04 : 0.005) : st >= 4 ? 0.04 + 0.035 * (st - 4) : 0.012;
        if (x.line === 'GK') pr *= 0.12;
        if (x.rating >= best - 1) pr *= 0.7;
        if (EN != null && EN < 56 && x.line !== 'GK') why = 'tired'; /* 精力见底的主力一定轮换（有人可替时） */
        else if (rnd() < Math.min(0.5, pr)) why = 'rest';
      }
      if (!why) return { ...x, start: 1 };
      const p = repl(x.slot, why === 'rest' ? x.rating - 7 : why === 'tired' ? x.rating - 10 : null);
      if (!p) return { ...x, start: 1 };
      if (why === 'rest' || why === 'tired') rested.push(x.name); else missing.push({ name: x.name, why });
      const cost = fitCost(x.slot, p);
      return { slot: x.slot, name: p.name, rating: Math.max(60, p.rating - cost), p, x: x.x, y: x.y, line: x.line, start: 1, sub4: x.name };
    });
    if (ctx.energy) xi.forEach(x => { const E = ctx.energy[x.name]; if (E == null) return; x.en = Math.round(E); const d = fatPen(E); if (d) { x.rating = Math.max(50, Math.round(x.rating - d)); x.fat = +d.toFixed(1); } });
    const onXI = new Set(xi.map(x => x.name));
    const bench = base.bench.filter(p => !onXI.has(p.name) && !out[p.name]).concat(base.xi.filter(x => !onXI.has(x.name) && !out[x.name]).map(x => x.p)).sort((a, b) => b.rating - a.rating);
    return { xi, bench, out: missing, rested };
  }

  // ---------- 天气/时段状态 ----------
  const WEATHERS = ['晴天', '阴天', '雨天'];
  const SLOTS = ['早上', '上午', '中午', '下午', '傍晚', '晚上', '深夜', '凌晨'];
  let teamMod = null;
  const setTeamMod = f => { teamMod = f; };
  function condition(team, weather, slot, opp) {
    const P = HISTORY.profiles[team] || {};
    const parse = s => (s || '').split(/[；;]/).map(x => x.trim());
    const [bw, bt] = parse(P.best), [ww, wt] = parse(P.worst);
    let m = 1, tags = [], mods = [];
    const add = (txt, d) => { m += d / 100; tags.push(txt); mods.push({ txt, d }); };
    if (bw === weather) add('喜欢' + weather, 4);
    if (bt === slot) add('擅长' + slot, 4);
    if (ww === weather) add('怕' + weather, -4.5);
    if (wt === slot) add('不适应' + slot, -4.5);
    if (teamMod) (teamMod(team, opp) || []).forEach(x => add(x.txt, x.d));
    const level = m >= 1.075 ? '最佳' : m > 1.01 ? '良好' : m <= 0.925 ? '最差' : m < 0.99 ? '低迷' : '正常';
    return { m, level, tags, mods };
  }

  // ---------- 随机工具 ----------
  let seed = Date.now() % 2147483647;
  const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  function gauss() { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  function poisson(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= rnd(); } while (p > L); return k - 1; }
  function pick(arr, w) { const t = w.reduce((a, b) => a + b, 0); let r = rnd() * t; for (let i = 0; i < arr.length; i++) { r -= w[i]; if (r <= 0) return arr[i]; } return arr[arr.length - 1]; }

  // ---------- 战术打法：进攻型多进也多丢，防守型少丢也少进，反击克制控球 ----------
  function styleFx(s, opp) {
    s = s || ''; opp = opp || ''; let a = 0, d = 0;
    if (/极致攻击|攻击性控球|控球进攻|三叉戟|暴力突击|双核|核心终结|边路突破|中路渗透|攻击型/.test(s)) { a += 0.035; d -= 0.02; }
    if (/摆大巴|极致防守|稳固防守|坚固的防守|区域联防|压缩空间/.test(s)) { a -= 0.04; d += 0.055; }
    if (/反击/.test(s)) { a += 0.01; d += 0.02; if (/控球|压制/.test(opp)) a += 0.03; }
    if (/逼抢|压制|反抢/.test(s)) { a += 0.015; d += 0.01; if (/控球/.test(opp)) a += 0.015; }
    if (/控球|中场控制/.test(s)) { a += 0.01; d += 0.01; }
    return { a, d };
  }
  // ---------- 期望进球 ----------
  // opt.L = { h: pickXI(...), a: pickXI(...) } 时按实际首发计算
  // 俱乐部底蕴：按球队梯队把比赛实力往该梯队的水平拉（单位：能力分），由网页设定
  let teamAdj = null;
  const setTeamAdj = f => { teamAdj = f; };
  const shiftS = (X, d) => d ? { ...X, atk: X.atk + d, def: X.def + d, ctl: X.ctl + d, xiAvg: X.xiAvg + d, ovr: X.ovr + d, adj: d } : X;
  function expected(home, away, opt = {}) {
    let H = opt.L ? strengthOf(opt.L.h) : strength(home), A = opt.L ? strengthOf(opt.L.a) : strength(away);
    if (teamAdj) { H = shiftS(H, (teamAdj(home) || 0) * 0.86); A = shiftS(A, (teamAdj(away) || 0) * 0.86); }
    const ch = condition(home, opt.weather, opt.slot, away), ca = condition(away, opt.weather, opt.slot, home);
    const homeAdv = opt.neutral ? 1 : 1.12, awayPen = opt.neutral ? 1 : 0.94;
    const k = 0.078 / 0.86; // 能力分 78 以上压缩了 0.86，系数同步放大，强弱差距的效果不变
    const sh = styleFx((TEAMS_DATA[home] || {}).style, (TEAMS_DATA[away] || {}).style), sa = styleFx((TEAMS_DATA[away] || {}).style, (TEAMS_DATA[home] || {}).style);
    let lh = 1.28 * Math.exp(k * (H.atk - A.def)) * Math.exp(0.0465 * (H.ctl - A.ctl)) * homeAdv * ch.m / Math.sqrt(ca.m) * (1 + sh.a) * (1 - sa.d);
    let la = 1.28 * Math.exp(k * (A.atk - H.def)) * Math.exp(0.0465 * (A.ctl - H.ctl)) * awayPen * ca.m / Math.sqrt(ch.m) * (1 + sa.a) * (1 - sh.d);
    return { lh: Math.min(lh, 5), la: Math.min(la, 5), ch, ca, H, A };
  }

  function quickScore(home, away, opt) {
    const e = expected(home, away, opt);
    const fh = Math.max(0.6, 1 + gauss() * 0.13), fa = Math.max(0.6, 1 + gauss() * 0.13);
    return [poisson(e.lh * fh), poisson(e.la * fa)];
  }

  function probabilities(home, away, opt, n = 1500) {

  // X: [{slot,line,r,attr,min?,start?}]；o: {goals:[[进球者下标,助攻者下标,是否点球]], pmiss:[[下标,是否被扑]], cards:[[下标,是否红牌,分钟]], shots, ot, oppOt, gf, ga, poss, press}

  function sideStats(X, o) {

  // opt: { weather, slot, neutral, ctx: { h, a }（伤停/轮换上下文，可省略）}
