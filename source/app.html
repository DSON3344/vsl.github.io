<title>威超联赛中心</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 控制室仪表盘 — 近黑底、等宽字体数字、细线发光图表、玻璃面板；联赛金只留给冠军与奖杯 */
:root{
  --bg:#06080c; --bg-2:#0a0e15; --panel:rgba(150,180,235,.035); --panel-2:rgba(150,180,235,.07);
  --line:rgba(150,180,235,.11); --line-2:rgba(150,180,235,.22);
  --fg:#e3e9f2; --fg-2:#9ba7b9; --fg-3:#5c687a;
  --accent:#9cc2ff; --accent-2:#d6e5ff; --accent-dim:rgba(156,194,255,.14);
  --gold:#d8b45f; --gold-dim:rgba(216,180,95,.14);
  --win:#4fd18b; --draw:#8b95a6; --loss:#ff6767;
  --z1:#6ea8ff; --z2:#50cfe0; --z3:#3fb39b; --zr:#ff6767;
  --pitch:#0c1712; --pitch-line:rgba(190,230,205,.16);
  --mono:"Martian Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:14px;line-height:1.55;min-height:100vh;
  background-image:radial-gradient(rgba(150,180,235,.07) 1px,transparent 1px);background-size:22px 22px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)} .dim{color:var(--fg-3)}

/* ---------- Top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,8,12,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex-shrink:0}
.brand img{width:30px;height:auto}
.brand b{font-weight:900;font-size:15px;letter-spacing:.02em;display:block;line-height:1.1}
.brand small{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--fg-3)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:4px;color:var(--fg-2);white-space:nowrap;font-weight:500;font-size:13.5px;position:relative}
nav.tabs button:hover{color:var(--fg);background:var(--panel)}
nav.tabs button[aria-current="page"]{color:var(--accent-2)}
nav.tabs button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-11px;height:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.roundchip{font-family:var(--mono);font-size:11px;color:var(--fg-2);border:1px solid var(--line-2);padding:5px 9px;border-radius:3px;white-space:nowrap;flex-shrink:0}
.roundchip b{color:var(--accent-2);font-weight:500}
button.roundchip{background:none;cursor:pointer;font-family:var(--mono)}
button.roundchip:hover{border-color:var(--accent);color:var(--fg)}
@media (max-width:760px){.top-in{flex-wrap:wrap;gap:8px 12px}.brand small{display:none}nav.tabs{order:3;flex-basis:100%}nav.tabs button[aria-current="page"]::after{bottom:-3px}}

/* ---------- Page ---------- */
main{max-width:1280px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:18px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-weight:900;font-size:clamp(26px,3.6vw,40px);letter-spacing:-.01em;line-height:1.1}
h2{font-weight:700;font-size:16px;letter-spacing:.01em}
.panel{background:linear-gradient(180deg,rgba(150,180,235,.045),rgba(150,180,235,.015));border:1px solid var(--line);border-radius:6px;padding:18px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph .eyebrow{margin-bottom:2px}
.grid{display:grid;gap:18px}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:980px){.g-main,.g-3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g-2{grid-template-columns:minmax(0,1fr)}}

.btn{border:1px solid var(--line-2);background:var(--panel);padding:8px 14px;border-radius:4px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel-2);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#06101f;border-color:var(--accent);font-weight:700}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:none;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 8px;border-radius:3px;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap}
button.chip.lnk{border:1px solid rgba(156,194,255,.4);padding:3px 8px;color:var(--accent-2);font-size:11.5px}
button.chip.lnk:hover{background:var(--accent-dim)}
.chip.gold{color:var(--gold);border-color:rgba(216,180,95,.4);background:var(--gold-dim)}
.chip.good{color:var(--win);border-color:rgba(79,209,139,.35)}
.chip.bad{color:var(--loss);border-color:rgba(255,103,103,.35)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{background:none;border:0;padding:6px 11px;font-size:12.5px;color:var(--fg-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-dim);color:var(--accent-2)}
select,input[type=search]{background:var(--bg-2);border:1px solid var(--line-2);border-radius:4px;padding:7px 10px;font-size:13px;max-width:100%}
.crest{object-fit:contain;flex-shrink:0;display:block}
.tname{display:flex;align-items:center;gap:9px;min-width:0}
.tname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.lnk,button.lnk{background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer}
button.lnk:hover span,a.lnk:hover{color:var(--accent-2)}

/* tables */
.tw{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.12em;color:var(--fg-3);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid rgba(150,180,235,.06);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th.l,td.l{text-align:left;font-family:var(--sans)}
tbody tr:hover{background:rgba(150,180,235,.04)}
td.pos{width:34px;position:relative;color:var(--fg-2)}
td.pos::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--zc,transparent)}
tr.z1{--zc:var(--z1)} tr.z2{--zc:var(--z2)} tr.z3{--zc:var(--z3)} tr.zr{--zc:var(--zr)}
td.pts{color:var(--accent-2);font-weight:500}
.form{display:inline-flex;gap:3px}
.form i{width:16px;height:16px;border-radius:2px;font-style:normal;font-size:9px;display:grid;place-items:center;font-weight:700;color:#06080c}
.form i.W{background:var(--win)} .form i.D{background:var(--draw)} .form i.L{background:var(--loss)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--fg-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:10px;height:2px;background:var(--c)}

/* fixtures */
.fx{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid rgba(150,180,235,.06);cursor:pointer;border-radius:3px}
.fx:hover{background:rgba(150,180,235,.04)}
.fx .h{justify-content:flex-end;text-align:right}
.fx .h span{order:-1}
.fx .sc{font-family:var(--mono);font-size:15px;min-width:76px;text-align:center;display:grid;gap:1px}
.fx .sc small{font-size:9.5px;color:var(--fg-3);letter-spacing:.04em;font-family:var(--sans)}
.fx .sc b{font-weight:500}
.fx .sc .vs{color:var(--fg-3);font-size:12px}
.fx.played .sc b{color:var(--fg)}
.fx .win span{color:var(--fg);font-weight:700}
.fx .lose span{color:var(--fg-2)}

/* hero overview */
.ovhero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center}
.ovhero .big{font-family:var(--mono);font-size:clamp(48px,7vw,84px);line-height:.9;font-weight:300;letter-spacing:-.04em;color:var(--accent-2);text-shadow:0 0 30px rgba(156,194,255,.35)}
.ovhero .big small{font-size:.32em;letter-spacing:0;color:var(--fg-3);margin-left:6px}
@media (max-width:760px){.ovhero{grid-template-columns:minmax(0,1fr)}}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);box-shadow:0 0 8px var(--accent)}

.recap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.champ{position:relative;display:grid;place-items:center;width:118px;height:118px}
.champ::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(closest-side,rgba(216,180,95,.28),transparent)}
.cups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cup{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:4px;min-width:0}
.cup b{font-size:13px} .cup small{display:block;color:var(--fg-3);font-size:11px;line-height:1.35;white-space:normal}
@media (max-width:520px){.recap{grid-template-columns:minmax(0,1fr)}.cups{grid-template-columns:minmax(0,1fr)}}

.rank-list{display:grid;gap:2px}
.rk{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 4px;font-size:13px;border-radius:3px}
.rk:hover{background:rgba(150,180,235,.04)}
.rk .n{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.rk .v{font-family:var(--mono);color:var(--accent-2)}
.rk .sub{font-size:11px;color:var(--fg-3)}

/* chart */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--mono);font-size:9px;fill:var(--fg-3)}
.chart .gl{stroke:rgba(150,180,235,.08)}
.chart .ln{fill:none;stroke-width:1.6;filter:url(#glow)}
.chart .champ-halo{animation:champPulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes champPulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
.empty{border:1px dashed var(--line-2);border-radius:4px;padding:22px;text-align:center;color:var(--fg-3);font-size:13px}

/* match center */
.setup{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.setup label{display:grid;gap:5px;font-size:11px;color:var(--fg-3);font-family:var(--mono);letter-spacing:.08em}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center;text-align:center}
.side{display:grid;justify-items:center;gap:8px;min-width:0}
.side .glow{position:relative;display:grid;place-items:center;width:120px;height:120px}
.side .glow::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(closest-side,var(--tc),transparent);opacity:.32}
.side h3{font-weight:900;font-size:clamp(18px,2.4vw,26px)}
.side .en{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--fg-3);text-transform:uppercase}
.score{font-family:var(--mono);font-weight:300;font-size:clamp(46px,8vw,92px);line-height:1;letter-spacing:-.04em;color:var(--fg);white-space:nowrap}
.score .sep{color:var(--fg-3);margin-inline:.12em}
.clock{font-family:var(--mono);font-size:13px;color:var(--accent-2);margin-top:6px;letter-spacing:.1em}
.clock.ft{color:var(--gold)}
@media (max-width:560px){.board{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 10px;align-items:start}.board>.side:first-child{grid-column:1;grid-row:1}.board>.side:last-child{grid-column:2;grid-row:1}.board>div:nth-child(2){grid-column:1/-1;grid-row:2}.condrow .chip{font-size:10.5px;padding:2px 6px}.side .glow{width:72px;height:72px}.side .glow img{width:64px!important;height:64px!important}}
.prob{display:grid;gap:6px}
.prob .track{display:flex;height:8px;border-radius:2px;overflow:hidden;gap:2px}
.prob .track i{display:block;height:100%}
.prob .lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--fg-2)}
.cmp{display:grid;gap:9px}
.cmp .row{display:grid;grid-template-columns:44px minmax(0,1fr) 72px minmax(0,1fr) 44px;gap:8px;align-items:center;font-family:var(--mono);font-size:12px}
.cmp .row .k{text-align:center;font-family:var(--sans);font-size:11.5px;color:var(--fg-2)}
.cmp .row .l{display:flex;justify-content:flex-end}
.cmp .row b{font-weight:500}
.cmp .row .r{text-align:right}
.cmp .hb{height:5px;border-radius:1px}
.timeline{position:relative;height:30px;margin-top:6px}
.timeline .rail{position:absolute;left:0;right:0;top:14px;height:2px;background:var(--line)}
.timeline .prog{position:absolute;left:0;top:14px;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.timeline .ht{position:absolute;left:50%;top:8px;width:1px;height:14px;background:var(--line-2)}
.timeline .mk{position:absolute;top:6px;width:8px;height:8px;margin-left:-4px;border-radius:50%}
.timeline .mk.a{top:18px}
.timeline .mk.goal{background:var(--fg);box-shadow:0 0 8px var(--fg)}
.timeline .mk.yellow{background:#e8c547;border-radius:1px;width:6px;margin-left:-3px}
.timeline .mk.red{background:var(--loss);border-radius:1px;width:6px;margin-left:-3px}
.timeline .ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--fg-3);position:absolute;top:30px;left:0;right:0}
.feed{display:grid;gap:0;max-height:420px;overflow-y:auto}
.ev{display:grid;grid-template-columns:48px 22px minmax(0,1fr);gap:10px;align-items:start;padding:9px 4px;border-bottom:1px solid rgba(150,180,235,.06);font-size:13px}
.ev .m{font-family:var(--mono);color:var(--fg-3);font-size:12px;padding-top:1px}
.ev.goal .m{color:var(--accent-2)}
.ev.goal .t b{font-weight:700}
.ev .ic{width:18px;height:18px;display:grid;place-items:center}
.ev .ic .card{width:10px;height:14px;border-radius:1.5px}
.ev.new{animation:evin .5s ease-out}
@keyframes evin{from{background:rgba(156,194,255,.16)}to{background:transparent}}
.ev.div{grid-template-columns:1fr;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--fg-3);padding:7px}
.condrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:24px}
.reels{display:flex;gap:10px;justify-content:center;margin-top:14px}
.reel{display:grid;gap:5px;justify-items:center}
.reel-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--fg-3)}
.reel-win{width:86px;height:42px;overflow:hidden;border:1px solid var(--line-2);border-radius:4px;background:var(--bg-2);position:relative;box-shadow:inset 0 0 14px rgba(0,0,0,.7);transition:border-color .3s,box-shadow .3s}
.reel-win::before,.reel-win::after{content:"";position:absolute;left:0;right:0;height:12px;z-index:1;pointer-events:none}
.reel-win::before{top:0;background:linear-gradient(var(--bg-2),transparent)}
.reel-win::after{bottom:0;background:linear-gradient(transparent,var(--bg-2))}
.reel-strip div{height:42px;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--fg)}
.reel-strip .q{color:var(--fg-3);font-family:var(--mono)}
.reel.done .reel-win{border-color:var(--accent);box-shadow:0 0 16px rgba(156,194,255,.35),inset 0 0 14px rgba(0,0,0,.7)}
.reel.done .reel-strip div{color:var(--accent-2)}
.chip.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.rollmsg{font-family:var(--mono);font-size:12px;color:var(--fg-2);text-align:center;letter-spacing:.06em}
.prob .lbl b{color:var(--fg);font-weight:500}

/* pitch */
.pitch svg{width:100%;max-width:860px;margin:0 auto;height:auto;display:block}
[hidden]{display:none!important}
.pitch .p-bg{fill:var(--pitch)}
.pitch .p-ln{fill:none;stroke:var(--pitch-line);stroke-width:.3}
.pitch .p-stripe{fill:rgba(255,255,255,.012)}
.pitch text{font-family:var(--mono);text-anchor:middle;dominant-baseline:central}
.pitch .rt{font-size:1.75px;font-weight:700;fill:#05080c}
.pitch .nm{font-family:var(--sans);font-size:1.7px;fill:var(--fg);paint-order:stroke;stroke:var(--pitch);stroke-width:.5px}
.pitch g.pl{cursor:pointer}
.pitch g.pl:hover circle{stroke:#fff;stroke-width:.35}
@media (max-width:560px){.pitch .nm{display:none}}

/* teams */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{display:grid;justify-items:center;gap:8px;padding:16px 10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:center;transition:border-color .15s,transform .15s;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;inset:auto 0 0 0;height:2px;background:var(--tc);opacity:.6}
.tcard:hover{border-color:var(--line-2);transform:translateY(-2px)}
.tcard b{font-size:14px;font-weight:700}
.tcard small{font-family:var(--mono);font-size:10px;color:var(--fg-3)}
.thero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;position:relative}
.thero .glow{position:relative;width:180px;height:180px;display:grid;place-items:center}
.thero .glow::before{content:"";position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(closest-side,var(--tc),transparent);opacity:.3}
.thero h1{font-size:clamp(32px,5vw,56px)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:16px}
.facts div{background:var(--bg-2);padding:10px 12px;min-width:0}
.facts dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--fg-3)}
.facts dd{margin:2px 0 0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.thero{grid-template-columns:minmax(0,1fr);justify-items:start}.thero .glow{width:120px;height:120px}.thero .glow img{width:110px!important;height:110px!important}}
.troph{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.troph div{background:var(--bg-2);padding:12px;text-align:left}

/* ---------- logos: base64 → blob URL ---------- */

  return c;
}
const tcol = t => vis((TD[t] && TD[t].color) || '#9cc2ff');
const rtColor = r => r >= 90 ? '#d8b45f' : r >= 85 ? '#9cc2ff' : r >= 80 ? '#7fd6b4' : r >= 75 ? '#a9b4c4' : '#6f7b8c';

/* ---------- 赛季状态 ---------- */
const KEY = 'ves-league-s01-v1';
let S;
function newSeason() {
  const teams = HIST.s1.slice();

}
const DIRTY = new Set();
function save() { S.updated = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} cloudQueue(); }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.fx && s.teams) return s; } catch (e) {} return null; }
// 比赛结果压缩存储。ev: [分钟, 类型, 主/客, 球员, 助攻者/被换下者, 附加值（点球=1 / 伤停轮数 / 被扑=1 / 直红=1）]

const luOf = (m, i) => m.r.lu ? m.r.lu[i].map(([n, sl], k) => ({ name: n, slot: sl, start: m.r.pl && m.r.pl[i][k] && m.r.pl[i][k][12] != null ? m.r.pl[i][k][12] : 1 })) : ENGINE.lineup(i ? m.a : m.h).xi.map(x => ({ name: x.name, slot: x.slot, start: 1 }));
// 某队在第 ri 轮开赛前的伤停与连续首发情况，全部由已赛结果推出（伤病、红牌停赛、累计 5/10 张黄牌停赛）
function teamCtx(team, ri, fx = S.fx) {
  const ban = {}, why = {}, yel = {}; let streak = {};
  for (let k = 0; k < ri; k++) {
    const m = fx[k] && fx[k].find(x => x.h === team || x.a === team); if (!m || !m.r) continue;
    const i = m.h === team ? 0 : 1, side = i ? 'a' : 'h';
    const ns = {}; luOf(m, i).forEach(x => { if (x.start) ns[x.name] = (streak[x.name] || 0) + 1; }); streak = ns;
    const setBan = (n, until, w) => { if (until > (ban[n] ?? -1)) { ban[n] = until; why[n] = w; } };

  }
  const out = {};
  Object.keys(ban).forEach(n => { if (ban[n] >= ri) out[n] = { why: why[n], left: ban[n] - ri + 1 }; });

function raceChart(rows, rounds) {
  const W = 600, Hh = 220, pl = 28, pr = 70, pt = 12, pb = 24;
  const max = Math.max(3, ...rows.map(r => r.race[rounds - 1] || 0));
  const top = Math.ceil(max / 10) * 10;
  const x = i => pl + (rounds <= 1 ? 0 : i / (rounds - 1)) * (W - pl - pr);
  const y = v => pt + (1 - v / top) * (Hh - pt - pb);
  let g = '';
  for (let v = 0; v <= top; v += top / 4) g += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  const step = Math.max(1, Math.ceil(rounds / 8));
  for (let i = 0; i < rounds; i += step) g += `<text x="${x(i)}" y="${Hh - 6}" text-anchor="middle">R${i + 1}</text>`;
  const lab = rows.map(r => ({ t: r.team, y: y(r.race[rounds - 1]) })).sort((p, q) => p.y - q.y);
  for (let i = 1; i < lab.length; i++) if (lab[i].y - lab[i - 1].y < 11) lab[i].y = lab[i - 1].y + 11;
  const ly2 = Object.fromEntries(lab.map(l => [l.t, l.y]));
  const lines = rows.map(r => {
    const pts = r.race.slice(0, rounds).map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const lx = x(rounds - 1), ly = y(r.race[rounds - 1]);
    return `<polyline class="ln" points="${pts}" stroke="${tcol(r.team)}"/><circle cx="${lx}" cy="${ly}" r="3" fill="${tcol(r.team)}"/><text x="${lx + 7}" y="${ly2[r.team] + 3}" style="fill:var(--fg-2);font-family:var(--sans);font-size:10px">${esc(r.team)} ${r.race[rounds - 1]}</text>`;
  }).join('');

}
function rankChart(team) {

  Object.entries(EXT_CLUB).forEach(([c, x]) => { const v = sc(c); if (v) out.push({ v: v + 0.4, html: `<button data-ext="${esc(c)}">${ecrest(c, 24)}<span><b>${esc(c)}</b> <small>${esc(x.league)}</small></span><small>外赛区球队</small></button>` }); });
  PL.forEach((p, pid) => { if (!p || seen.has(pid)) return; const v = sc(p[0]); if (!v) return; const ts = teamsOfPid(pid); const pk = peakCache(pid); out.push({ v: v + (pk || 0) / 1000, html: `<button data-pid="${pid}">${ts[0] ? crest(ts[ts.length - 1], 22) : '<span></span>'}<span><b>${esc(p[0])}</b> <small>${esc(ts.join('、') || '—')} · ${esc(p[1])} · 退役</small></span>${pk ? `<span class="rt-pill" style="background:${rtColor(pk)}">${pk}</span>` : ''}</button>` }); });
  return out.sort((a, b) => b.v - a.v).slice(0, 30);
}

document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-fx],[data-hm],g.pl')) { e.preventDefault(); e.target.click ? e.target.click() : e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });

/* ---------- 跨设备同步 ----------
   在 Claude 里打开时：进度存进你账号下的私人数据（data/users/<你>/...），手机和电脑自动同步。
   在 ves.dson.site 打开时：进度存进 Vercel 云端（/api/progress），所有人可看，输入密码的设备才能写入。
   在其他地方（GitHub Pages / 本地文件）打开时：只能存在本机浏览器，可以用「导出 / 导入进度」手动搬。 */
const CLOUD = { db: null, meta: null, busy: false, status: 'local', ready: false };
const WEB = { on: false, etag: null, timer: null, busy: false, pending: false, key: '' };
try { WEB.key = localStorage.getItem('ves-sync-key') || ''; } catch (e) {}
function setSync(st) {
  CLOUD.status = st;
  const el = $('#syncChip'); if (!el) return;
  el.textContent = { local: '仅本机', cloud: '☁ 已同步', saving: '☁ 同步中…', error: '☁ 同步失败', connecting: '☁ 连接中…', view: '☁ 只读 · 点此解锁' }[st] || st;
  el.style.color = st === 'cloud' ? 'var(--win)' : st === 'error' ? 'var(--loss)' : '';
}
function cloudQueue() {
  if (CLOUD.db) return cloudFlush();
  if (WEB.on) { clearTimeout(WEB.timer); WEB.timer = setTimeout(webPush, 1200); }
}
async function cloudFlush() {
  if (!CLOUD.db || CLOUD.busy) return;
  CLOUD.busy = true; setSync('saving');
  try {
    while (DIRTY.size) {
      const i = DIRTY.values().next().value; DIRTY.delete(i);
      await CLOUD.meta.collection('rounds').doc('r' + String(i + 1).padStart(2, '0')).set({ fx: S.fx[i] });
    }
    for (let k = CLOUD.arch || 0; k < S.archive.length; k++) await CLOUD.meta.collection('archive').doc('s' + S.archive[k].s).set({ a: JSON.stringify(S.archive[k]) });
    CLOUD.arch = S.archive.length;
    await CLOUD.meta.set({ key: KEY, season: S.season, teams: S.teams, promoted: S.promoted || [], updated: S.updated || Date.now(), arch: S.archive.length });
    setSync('cloud');
  } catch (e) { setSync('error'); }
  CLOUD.busy = false;
  if (DIRTY.size) cloudFlush();
}
async function cloudPull(meta) {
  const q = await CLOUD.meta.collection('rounds').get();
  const rounds = new Array(38);
  q.docs.forEach(d => { const i = parseInt(d.id.slice(1), 10) - 1; const b = d.data(); if (i >= 0 && i < 38 && b) rounds[i] = b.fx; });
  if (rounds.filter(Boolean).length !== 38) return false;
  let archive = [];
  if (meta.arch) { const qa = await CLOUD.meta.collection('archive').get(); archive = qa.docs.map(d => { try { return JSON.parse(d.data().a); } catch (e) { return null; } }).filter(Boolean).sort((x, y) => x.s - y.s); if (archive.length < meta.arch) return false; }
  S = { season: meta.season, teams: meta.teams, promoted: meta.promoted, demo: false, updated: meta.updated, fx: JSON.parse(JSON.stringify(rounds)), archive };
  applyState(); CLOUD.arch = archive.length;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  return true;
}
async function cloudInit() {
  if (!window.claude || typeof window.claude.use !== 'function') return webInit();
  setSync('connecting');
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) { setSync('local'); return; }
    CLOUD.db = db; CLOUD.meta = db.doc('data/users/' + uid + '/s18meta');
    const snap = await CLOUD.meta.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && remote.key === KEY && (remote.updated || 0) > (S.updated || 0)) {
      if (await cloudPull(remote)) { if (!live) render(); toast('已载入其他设备的进度'); }
      setSync('cloud');
    } else { for (let i = 0; i < 38; i++) DIRTY.add(i); await cloudFlush(); }
    CLOUD.meta.onSnapshot(sn => {
      if (!sn.exists || sn.metadata.hasPendingWrites || CLOUD.busy) return;
      const d = sn.data();
      if (d && d.key === KEY && (d.updated || 0) > (S.updated || 0)) cloudPull(d).then(ok => { if (ok && !live) { render(); toast('已同步其他设备的进度'); } });
    }, () => setSync('error'));
  } catch (e) { setSync('local'); }
}
/* ---- Vercel 云端（ves.dson.site） ---- */
const countPlayed = st => (st && Array.isArray(st.fx) ? st.fx.filter(r => r.every(m => m.r)).length : 0);
function validState(st) { return st && Array.isArray(st.fx) && st.fx.length === 38 && Array.isArray(st.teams); }
async function webFetch(headers) {
  const r = await fetch('/api/progress', { cache: 'no-store', headers: headers || {} });
  if (r.status === 304) return { same: true };
  if (!r.ok) throw new Error('http ' + r.status);
  const o = await r.json();
  return { etag: o.etag || null, state: o.state || null };
}
function adopt(st, msg) {
  S = st; applyState(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (!live) { M = null; render(); }
  if (msg) toast(msg);
}
async function webPull(quiet) {
  if (!WEB.on || WEB.busy || WEB.pending) return;
  try {
    const o = await webFetch(WEB.etag ? { 'If-None-Match': WEB.etag } : null);
    if (o.same) return;
    WEB.etag = o.etag;
    const st = o.state;
    if (st && st.key === KEY && validState(st.s) && (st.s.updated || 0) > (S.updated || 0)) adopt(st.s, quiet ? null : '已同步其他设备的进度');
  } catch (e) { /* 网络抖动时下次再试 */ }
}
async function webPush() {
  if (!WEB.on) return;
  if (!WEB.key) { setSync('view'); return; }
  if (WEB.busy) { WEB.pending = true; return; }
  WEB.busy = true; WEB.pending = false; setSync('saving');
  try {
    const r = await fetch('/api/progress', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-ves-key': WEB.key }, body: JSON.stringify({ key: KEY, s: S }) });
    if (r.status === 401) { WEB.key = ''; try { localStorage.removeItem('ves-sync-key'); } catch (e) {} setSync('view'); toast('同步密码不对，进度只存在这台设备'); }
    else if (!r.ok) setSync('error');
    else { const o = await r.json(); WEB.etag = o.etag || WEB.etag; setSync('cloud'); }
  } catch (e) { setSync('error'); }
  WEB.busy = false;
  if (WEB.pending) webPush();
}
async function webInit() {
  if (!/^https?:$/.test(location.protocol) || /github\.io$/.test(location.hostname)) { setSync('local'); return; }
  setSync('connecting');
  let o;
  try { o = await webFetch(); } catch (e) { setSync('local'); return; }
  WEB.on = true; WEB.etag = o.etag;
  const st = o.state && o.state.key === KEY && validState(o.state.s) ? o.state.s : null;
  const lp = countPlayed(S);
  if (st && ((st.updated || 0) > (S.updated || 0) || (lp === 0 && countPlayed(st) > 0 && !(S.reset && S.reset >= (st.updated || 0))))) { adopt(st, countPlayed(st) ? '已载入云端进度' : null); setSync(WEB.key ? 'cloud' : 'view'); }
  else if (WEB.key && lp > 0) await webPush();
  else setSync(WEB.key ? 'cloud' : 'view');
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') webPull(); });
  window.addEventListener('focus', () => webPull());
}
async function unlockSync() {
  const inp = $('#syncKey'); const k = inp ? inp.value.trim() : '';
  const m = $('#syncMsg'); if (!k) { if (m) m.textContent = '请先输入密码。'; return; }
  try {
    const r = await fetch('/api/progress', { method: 'POST', headers: { 'x-ves-key': k } });
    if (r.status === 401) { if (m) m.textContent = '密码不对，再试一次。'; return; }
    if (!r.ok) throw 0;
  } catch (e) { if (m) m.textContent = '连不上云端，稍后再试。'; return; }
  WEB.key = k; try { localStorage.setItem('ves-sync-key', k); } catch (e) {}
  if (m) m.textContent = '已解锁，这台设备的模拟结果会自动同步。';
  await webPull(true);
  if (countPlayed(S) > 0) await webPush(); else setSync('cloud');
  openSync();
}
function openSync() {
  const d = $('#dlg');
  const cloud = !!CLOUD.db;
  const web = WEB.on;
  d.innerHTML = `<div class="dlg" style="position:relative"><button class="btn ghost dlg-x" data-act="close" aria-label="关闭">✕</button>
    <div><div class="eyebrow">Season ${SEASON} progress</div><h2 style="font-size:20px;font-weight:900;margin-top:4px">进度同步</h2></div>
    ${web ? (WEB.key ? `<p class="muted" style="margin:0">已解锁。这台设备的模拟结果会自动存到云端，手机和电脑打开 ves.dson.site 都会看到同一份进度。</p><div class="btns"><button class="btn ghost" data-act="lockSync">在这台设备上锁定</button></div>` : `<p class="muted" style="margin:0">所有人都能看到云端的 S${SEASON} 进度。输入同步密码后，这台设备的模拟结果才会写入云端；不输入的话，模拟结果只留在这台设备。</p><div class="btns"><input id="syncKey" type="password" placeholder="同步密码" autocomplete="current-password" style="flex:1;min-width:0;background:var(--bg-2);border:1px solid var(--line-2);border-radius:4px;padding:7px 10px;font-size:13px;color:var(--fg)"><button class="btn" data-act="unlockSync">解锁</button></div>`) : cloud ? `<p class="muted" style="margin:0">这个页面在 Claude 里打开，S${SEASON} 进度会自动存到你的账号，用同一个账号在手机或电脑打开这个页面，进度会自动同步。</p>`
      : `<p class="muted" style="margin:0">现在打开的网站只能把进度存在这台设备的浏览器里，换设备不会自动同步。可以在这里导出进度文件，到另一台设备上导入。</p>`}
    <div class="btns"><button class="btn" data-act="exportSave">导出进度文件</button><label class="btn" style="cursor:pointer">导入进度文件<input type="file" id="importSave" accept="application/json,.json" hidden></label></div>
    <p class="note" style="margin:0" id="syncMsg">已模拟 ${playedRounds()} 轮 · 上次保存 ${S.updated ? new Date(S.updated).toLocaleString('zh-CN') : '—'}</p></div>`;
  if (!d.open) d.showModal();
  const sk = $('#syncKey'); if (sk) sk.addEventListener('keydown', e => { if (e.key === 'Enter') unlockSync(); });
  $('#importSave').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const o = JSON.parse(rd.result); if (o.key !== KEY || !o.state || !Array.isArray(o.state.fx) || o.state.fx.length !== 38) throw 0; S = o.state; applyState(); for (let i = 0; i < 38; i++) DIRTY.add(i); save(); d.close(); M = null; render(); toast('进度已导入'); } catch (err) { $('#syncMsg').textContent = '这个文件不是威超的进度文件，请重新选择。'; } };
    rd.readAsText(f);
  });
}
async function exportSave() {
  const blob = new Blob([JSON.stringify({ key: KEY, exported: new Date().toISOString(), state: S })], { type: 'application/json' });
  const fname = `威超S${SEASON}进度_第${playedRounds()}轮.json`;
  try { const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; if (dl) { await dl.save({ filename: fname, data: blob }); const m = $('#syncMsg'); if (m) m.textContent = '已导出进度文件。'; return; } } catch (e) { const m = $('#syncMsg'); if (m) m.textContent = '没有导出。'; return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `威超S${SEASON}进度_第${playedRounds()}轮.json`; document.body.appendChild(a); a.click(); a.remove();
  const m = $('#syncMsg'); if (m) m.textContent = '已导出。若没有开始下载，说明当前页面不允许下载文件。';
}

if (MIGRATED) setTimeout(() => toast('S18 参赛名单已更新（泽尼联回到威超），赛季进度重新开始'), 400);

if (/vesdebug/.test(location.hash)) window.__ves = {
  simSeason() { S.fx.forEach((r, i) => playRound(i)); save(); maybeEndSeason(); return SEASON; },
  cups: s => cupsOf(s), season: () => SEASON, awards: s => { const A = awardsOf(s); return A && A.ballon.map(p => p.name + '@' + p.team); },
  names: () => [...Object.values(PDB).flat(), ...Object.values(FDB).flat()].map(p => p.name),
  strengths: () => Object.keys(TD).map(t => [t, +clubStrAt(t, SEASON).toFixed(1)]).sort((a, b) => b[1] - a[1]).slice(0, 6).concat(['阿罗拉', '蛮城', '皇族马'].map(t => [t, +clubStrAt(t, SEASON).toFixed(1)])),
  logs: () => ({ RET_LOG, TR_LOG }), future: () => FUTURE, champ: s => HS[s] && HS[s].table.slice(0, 3).map(r => r.team + r.pts).join(' ') + ' | 降 ' + (S.archive.find(A => A.s === s) || {}).relegated + ' 升 ' + (S.archive.find(A => A.s === s) || {}).next, top: s => (HPS[s] || []).slice().sort((a, b) => b.g - a.g).slice(0, 4).map(p => p.name + '/' + p.team + '/' + p.g).join(' '), teams: () => S.teams.join(','),
};
