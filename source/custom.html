<html lang="zh-CN">

<style>
/* 自定义联赛：和威超主站同一套配色变量（读同一个 ves_theme），独立存档 */
:root{--bg:#0c0c0a;--bg-2:#141412;--fg:#ece8df;--fg-2:#a7a195;--fg-3:#6e695f;--tint:236,232,223;--accent:#ff5b1f;--acc-rgb:255,91,31;--acc-ink:#1a0a03;--gold:#d6ad57;--win:#5cc48c;--draw:#8c877c;--loss:#e8574a;

:root[data-theme="pitch"]{--bg:#08110c;--bg-2:#0e1913;--fg:#e8efe4;--fg-2:#9db0a0;--fg-3:#5f7466;--tint:222,236,214;--accent:#b4e05a;--acc-rgb:180,224,90;--acc-ink:#0f1a05}
:root[data-theme="royal"]{--bg:#070a14;--bg-2:#0d1220;--fg:#e8ecf5;--fg-2:#9aa6bd;--fg-3:#5d6880;--tint:214,224,245;--accent:#e4b450;--acc-rgb:228,180,80;--acc-ink:#1d1403}

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.55 var(--sans);min-height:100vh;background-image:radial-gradient(1100px 680px at 8% -12%,rgba(var(--tint),.05),transparent 62%)}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}.muted{color:var(--fg-2)}.dim{color:var(--fg-3)}

.arch .st{font:500 10.5px var(--mono);letter-spacing:.12em}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.tcard{display:grid;justify-items:center;gap:6px;padding:16px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);text-align:center;cursor:pointer}.tcard:hover{border-color:var(--accent)}.tcard b{font-size:14px}

.big{font:800 clamp(44px,6vw,72px)/.9 var(--disp)}

.sel{width:16px;height:16px;accent-color:var(--accent)}
.tpl{display:flex;gap:8px;flex-wrap:wrap}.tpl button{padding:6px;border:1px solid var(--line-2);border-radius:4px;background:none}.tpl button.on{border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- 位置：参考 FIFA 的 15 个标准代码（与主站一致） ---------- */
const POS_DEF = { GK: ['Goalkeeper', '守门员'], CB: ['Centre Back', '中后卫'], LB: ['Left Back', '左后卫'], RB: ['Right Back', '右后卫'], LWB: ['Left Wing Back', '左翼卫'], RWB: ['Right Wing Back', '右翼卫'], CDM: ['Central Defensive Midfielder', '防守型中场'], CM: ['Central Midfielder', '中央中场'], CAM: ['Central Attacking Midfielder', '攻击型中场'], LM: ['Left Midfielder', '左中场'], RM: ['Right Midfielder', '右中场'], LW: ['Left Winger', '左边锋'], RW: ['Right Winger', '右边锋'], CF: ['Centre Forward', '中锋'], ST: ['Striker', '前锋'] };

const attrsFor = (pos, r, rnd) => { const o = {}; Object.entries(tplFor(pos)).forEach(([k, d]) => o[k] = clamp(Math.round(r + d + (rnd() - 0.5) * 8), 20, 99)); return o; };
const SQUAD_TPL = ['GK', 'GK', 'GK', 'CB', 'CB', 'CB', 'CB', 'LB', 'LB', 'RB', 'RB', 'CDM', 'CDM', 'CM', 'CM', 'CM', 'CAM', 'LM', 'RM', 'LW', 'RW', 'CF', 'ST', 'ST'];
const XI433 = [['GK', 5, 50, 'GK'], ['LB', 25, 10, 'LB'], ['LCB', 20, 35, 'CB'], ['RCB', 20, 65, 'CB'], ['RB', 25, 90, 'RB'], ['LCM', 50, 30, 'CM'], ['CDM', 40, 50, 'CDM'], ['RCM', 50, 70, 'CM'], ['LW', 80, 15, 'LW'], ['ST', 86, 50, 'ST'], ['RW', 80, 85, 'RW']];
/* ---------- 名字生成 ---------- */
const SY = '阿巴卡达德埃法加哈伊卡拉马纳奥帕罗萨塔乌维西扎贝科莱米尼佩里斯托杰克诺布格霍金洛莫蒙普桑索特温亚伯迪费吉胡基利曼奈欧皮雷施泰沃'.split(''), EN = ['斯', '德', '尔', '诺', '森', '克', '特', '罗', '尼', '奇', '曼', '顿', '维奇', '松', '兹', '加', '亚', '里奥', '多', '内'];
const NATS = ['英格兰', '西班牙', '意大利', '德国', '法国', '荷兰', '葡萄牙', '比利时', '巴西', '阿根廷', '克罗地亚', '丹麦', '瑞典', '挪威', '波兰', '塞尔维亚', '日本', '韩国', '中国', '马来西亚', '美国', '墨西哥', '尼日利亚', '塞内加尔', '摩洛哥'];
const CITY1 = '北南东西新青云海河湖山港林石金银白黑红星月风雷远长安宁泰华嘉临江沙岩松'.split(''), CITY2 = '州港城川原湾岭滩堡洲阳谷都津源浦岛'.split('');
const NICK = ['联', '城', '竞技', '流浪者', '体育', '雄鹰', '猛虎', '雄狮', '狼队', '飞龙', '鲨鱼', '黑熊', '猎隼', '骑士', '先锋', '巨人', '海盗', '火箭', '红魔', '蓝鸟'];
const STY = ['控球进攻', '快速反击', '高位逼抢', '边路突破', '中路渗透', '稳固防守', '全面攻守', '核心终结', '双核爆破', '三叉戟齐飞', '攻击型中场的支援'];
function personName(rnd, used) { for (let k = 0; k < 60; k++) { const n = SY[Math.floor(rnd() * SY.length)] + (rnd() < 0.7 ? SY[Math.floor(rnd() * SY.length)] : '') + EN[Math.floor(rnd() * EN.length)]; if (!used.has(n)) { used.add(n); return n; } } const n = 'X' + Math.floor(rnd() * 1e6); used.add(n); return n; }
function teamName(rnd, used) { for (let k = 0; k < 80; k++) { const c = CITY1[Math.floor(rnd() * CITY1.length)] + CITY2[Math.floor(rnd() * CITY2.length)], n = c + NICK[Math.floor(rnd() * NICK.length)]; if (!used.has(n)) { used.add(n); return [n, c]; } } return ['球队' + used.size, '城市']; }
const LET = 'ABCDEFGHJKLMNPRSTUVWXYZ';
function shortCode(rnd, used) { for (let k = 0; k < 200; k++) { const c = [0, 1, 2].map(() => LET[Math.floor(rnd() * LET.length)]).join(''); if (!used.has(c)) { used.add(c); return c; } } return 'T' + used.size; }
const hsl = (h, s, l) => `hsl(${Math.round(h)} ${Math.round(s)}% ${Math.round(l)}%)`;
const toHex = c => { const d = document.createElement('div'); d.style.color = c; document.body.appendChild(d); const m = getComputedStyle(d).color.match(/\d+/g).map(Number); d.remove(); return '#' + m.slice(0, 3).map(x => x.toString(16).padStart(2, '0')).join(''); };
/* ---------- 队徽：七种模板，存成参数（不存图片），统一 1:1 比例 ---------- */
const CREST_TPL = { shield: '盾牌型', circle: '圆形', oval: '椭圆形', classic: '传统徽章', geo: '现代几何', text: '简约文字', symbol: '独立图形' };
function crestSVG(t, px = 40) {
  const c = (t && t.crest) || {}, p = c.p || '#c0392b', s = c.s || '#f1c40f', bg = c.bg || '#111', fg = c.fg || '#fff', sh = esc((t && t.short) || '?'), yr = c.year ? esc(String(c.year)) : '', tp = c.tpl || 'shield', id = 'c' + Math.abs(Math.floor(ghash(JSON.stringify(c) + sh) * 1e9));
  const txt = (y, sz) => `<text x="50" y="${y}" text-anchor="middle" font-family="Barlow Condensed,Noto Sans SC,sans-serif" font-weight="800" font-size="${sz}" fill="${fg}" letter-spacing="1">${sh}</text>`, yt = yr ? `<text x="50" y="86" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8" fill="${fg}" opacity=".85">${yr}</text>` : '';

  else if (tp === 'oval') body = `<ellipse cx="50" cy="50" rx="38" ry="46" fill="${p}" stroke="${s}" stroke-width="5"/><path d="M14 50 H86" stroke="${s}" stroke-width="10" opacity=".7"/>${txt(59, 24)}${yt}`;

}
/* ---------- 存档：每个联赛一份，localStorage；索引只记名字和状态 ---------- */
const IDX_K = 'ves_custom_idx_v1', ARC_K = id => 'ves_custom_a_' + id;
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('本机存储空间不足，存档没有保存'); return false; } };
const idx = () => lsGet(IDX_K) || [];
function saveArc(A) { A.updated = Date.now(); if (!lsSet(ARC_K(A.id), A)) return; const L = idx().filter(x => x.id !== A.id); L.unshift({ id: A.id, name: A.name, short: A.short, status: A.status, teams: A.teams.length, season: A.season ? A.season.n : 0, updated: A.updated }); lsSet(IDX_K, L); }

function delArc(id) { try { localStorage.removeItem(ARC_K(id)); } catch (e) { } lsSet(IDX_K, idx().filter(x => x.id !== id)); }
const STATUS = { draft: '编辑中', built: '已建立', started: '已开始' };
/* ---------- 生成联赛 ---------- */
const PA_T = [[95, 97], [90, 94], [85, 89], [80, 84]], PA_P = [0.001, 0.005, 0.024, 0.08];
function genLeague(opt) {
  const rnd = seeded('lg|' + opt.seed), A = { id: uid('L'), ver: 1, name: opt.name, short: opt.short, country: opt.country || '', region: opt.region || '', seasonName: 'S', status: 'draft', created: Date.now(),
    rules: { n: opt.n, mode: opt.mode, pts: { w: 3, d: 1, l: 0 }, strength: opt.strength, squad: 24 }, teams: [], players: [], season: null, history: [] };
  const usedT = new Set(), usedS = new Set(), usedP = new Set();
  for (let i = 0; i < opt.n; i++) A.teams.push(genTeam(rnd, i, opt, usedT, usedS));
  A.teams.forEach((t, i) => genSquad(A, t, rnd, usedP));
